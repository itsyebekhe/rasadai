name: Iran Radar Update

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:
    inputs:
      manual_url:
        description: 'Paste a specific News URL to process (Leave empty for normal mode)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Script
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          MANUAL_URL: ${{ inputs.manual_url }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "IranRadarBot"
          git config --global user.email "bot@noreply.github.com"

          git add news.json market.json daily_summary.json bulletins.json special_reports.json

          if ! git diff --cached --quiet; then
            git commit -m "Update news feed"
            git push
          else
            echo "No changes to commit."
          fi
